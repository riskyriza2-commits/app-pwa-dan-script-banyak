<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECO-TING</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--g1:#0f7a35;--g2:#27b04f;--gd:#06381a;--bg:#f3f7f4;--card:#fff;--tx:#12261a;--mt:#5f7367;--ln:#e1e9e3;--ac:#ffd24a;--rd:#d6453d;--ok:#1b8f4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1510;--card:#15211a;--tx:#e8f3ec;--mt:#93a89b;--ln:#243329;--g1:#1b9446;--gd:#03200e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1510;--card:#15211a;--tx:#e8f3ec;--mt:#93a89b;--ln:#243329;--g1:#1b9446;--gd:#03200e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.hd{background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff;padding:18px 16px 70px;border-radius:0 0 26px 26px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.av{width:40px;height:40px;border-radius:50%;background:#fff3;display:grid;place-items:center;font-weight:800}
.hd small{opacity:.85}
.wal{margin:-52px 14px 0;background:var(--card);border-radius:18px;padding:14px;box-shadow:0 6px 18px #0002;position:relative}
.wal b{font-size:22px}
.wal .acts{display:flex;gap:8px;margin-top:12px}
.acts button{flex:1;background:var(--bg);border-radius:12px;padding:9px 4px;font-weight:600;font-size:12px}
.sec{padding:16px 14px 0}
.sec h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sv{background:none;text-align:center;font-size:11.5px;font-weight:600;color:var(--tx);padding:0}
.sv i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 5px;border-radius:16px;background:var(--card);font-style:normal;font-size:24px;box-shadow:0 2px 8px #0001}
.sv i{position:relative}.bdg{position:absolute;top:-5px;right:-5px;background:var(--rd);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-style:normal}
input:disabled{opacity:.5}
.tb{width:100%;border-collapse:collapse;font-size:11.5px}.tb th,.tb td{padding:6px 5px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}.tb th{color:var(--mt);font-weight:700}.tb .n{text-align:right;white-space:nowrap}.tb tfoot td{font-weight:800}
.pro{border-radius:16px;padding:16px;background:linear-gradient(120deg,var(--gd),var(--g1));color:#fff;display:flex;gap:12px;align-items:center}
.pro b{font-size:15px}.pro span{font-size:12px;opacity:.9}
.pro em{font-style:normal;font-size:38px}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px #0001}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat div{background:var(--card);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:17px;color:var(--g1)}.stat span{font-size:11px;color:var(--mt)}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:#ffe9a8;color:#6b4d00}
.tag.s{background:#cdf1d9;color:#0b5a28}.tag.d{background:#fbd5d2;color:#8a1c16}
.mt{color:var(--mt);font-size:12px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--ln);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:1;background:none;font-size:11px;font-weight:600;color:var(--mt);padding:4px}
.nav button i{display:block;font-style:normal;font-size:20px}
.nav button.on{color:var(--g1)}
.pad{padding-bottom:84px}
.btn{width:100%;background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff;font-weight:800;padding:13px;border-radius:12px;margin-top:10px}
.btn.o{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
.btn.r{background:var(--rd)}
label{display:block;font-weight:600;font-size:12px;margin:10px 0 4px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--ln);background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border:1px solid var(--ln);border-radius:99px;padding:7px 11px;font-size:12px;font-weight:600}
.chip.on{background:var(--g1);color:#fff;border-color:var(--g1)}
.auth{padding:0 0 30px}
.auth .top{background:linear-gradient(160deg,var(--gd),var(--g1) 60%,var(--g2));color:#fff;text-align:center;padding:48px 20px 70px;border-radius:0 0 32px 32px}
.lg{width:104px;height:104px;margin:0 auto;background:#fff;border-radius:28px;display:grid;place-items:center;box-shadow:0 6px 20px #0004}.lg img{width:86%;height:86%;object-fit:contain}.lg.s{width:42px;height:42px;margin:0;border-radius:12px}
.auth .top h1{margin:8px 0 2px;font-size:32px;font-weight:800;letter-spacing:-.5px}
.auth .box{margin:-44px 16px 0;background:var(--card);border-radius:20px;padding:16px;box-shadow:0 8px 24px #0003}
.tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:6px}
.tabs button{flex:1;background:none;padding:9px;border-radius:9px;font-weight:700;color:var(--mt)}
.tabs button.on{background:var(--card);color:var(--g1);box-shadow:0 1px 4px #0002}
.shade{position:fixed;inset:0;background:#0007;z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--gd);color:#fff;padding:10px 16px;border-radius:99px;z-index:20;font-weight:600;max-width:90%}
.struk{border:1px dashed var(--mt);border-radius:10px;padding:12px;font-size:13px}
.struk div{display:flex;justify-content:space-between;padding:3px 0}
.hint{background:#fff6d6;color:#5c4600;border-radius:10px;padding:8px 10px;font-size:12px;margin-top:10px}
.empty{text-align:center;color:var(--mt);padding:26px 10px}
.pr{display:flex;align-items:center;gap:8px;margin-bottom:8px}.pr span{flex:1;font-weight:600}.pr input{width:110px}
</style>
</head>

'<div class="card" style="margin-top:12px"><div class="row sp"><span>Total debit semua akun</span><b>'+rp(td)+'</b></div><div class="row sp"><span>Total kredit semua akun</span><b>'+rp(tk)+'</b></div><div class="mt">'+(Math.abs(td-tk)<1?"✓ Seimbang":"⚠ Tidak seimbang")+'</div></div>')}
function riwayat(){
var u=me(),pg=u.role==="pengumpul",os=mine(u).filter(function(o){return pg||o.status==="Selesai"});
var wd=DB.wd.filter(function(w){return w.u===u.id}).reverse();
sheet('<b style="font-size:17px">'+(pg?"Riwayat":"Riwayat pembelian")+'</b>'+(pg?'':'<div class="mt">Pembelian yang sudah selesai</div>')+'<div style="margin-top:10px">'+(os.length?os.map(function(o){return orderCard(o,pg)}).join(""):'<div class="empty">'+(pg?"Belum ada transaksi.":"Belum ada pembelian yang selesai.")+'</div>')+'</div>'+
(pg&&wd.length?'<b>Penarikan</b><div style="margin-top:8px">'+wd.map(function(w){return '<div class="card row sp"><span>'+esc(w.m)+' · '+w.t+'</span><b>-'+rp(w.n)+'</b></div>'}).join("")+'</div>':''))}
function struk(id){
var o=DB.orders.find(function(x){return x.id===id});
sheet('<b style="font-size:17px">Struk digital</b><div class="struk" style="margin-top:10px"><div><span>No.</span><span>ET-'+o.id.toString().slice(-6)+'</span></div><div><span>Tanggal</span><span>'+o.tgl+'</span></div><div><span>Pengumpul</span><span>'+esc(uname(o.by))+'</span></div><div><span>Pengepul</span><span>'+esc(uname(o.to))+'</span></div><div><span>Jenis</span><span>'+esc(o.jenis)+'</span></div><div><span>Berat</span><span>'+o.final+' kg</span></div><div><span>Harga/kg</span><span>'+rp(o.total/o.final)+'</span></div><div><span>Ongkir</span><span>-'+rp(o.ongkir)+'</span></div><hr><div><b>Diterima</b><b>'+rp(o.total-o.ongkir)+'</b></div></div><button class="btn o" onclick="closeSheet()">Tutup</button>')}
function tarikUI(){var u=me();sheet('<b style="font-size:17px">Tarik saldo</b><div class="card" style="margin-top:10px"><div class="mt">Rekening tujuan</div><b>'+esc(u.bank||"-")+' · '+esc(u.rek||"belum diisi")+'</b></div><label for="wn">Nominal (Rp)</label><input id="wn" type="number" min="10000" step="1000"><div class="chips" style="margin-top:8px"><button class="chip" onclick="document.getElementById(\'wn\').value='+Math.floor(u.saldo)+'">Tarik semua</button></div><button class="btn" onclick="tarik()">Tarik saldo</button><div class="mt" style="margin-top:6px">Minimal Rp10.000. Ini simulasi tanpa transaksi uang asli.</div>')}
function tarik(){
var u=me(),n=parseInt(document.getElementById("wn").value);
if(!u.rek)return toast("Nomor rekening belum diisi di akun");
if(!(n>=10000))return toast("Minimal penarikan Rp10.000");
if(n>u.saldo)return toast("Saldo tidak cukup");
u.saldo-=n;DB.wd.push({u:u.id,m:u.bank,n:n,t:new Date().toLocaleDateString("id-ID")});save();closeSheet();render();toast("Penarikan "+rp(n)+" ke "+u.bank+" diproses")}
function akun(u){
return '<div class="hd"><div class="row"><div class="av">'+esc(u.nama[0])+'</div><div><b>'+esc(dn(u))+'</b><br><small>'+(u.role==="pengepul"&&u.usaha?"Pemilik: "+esc(u.nama)+" · ":"")+esc(u.email)+' · '+(u.role==="pengumpul"?"Pengumpul":"Pengepul")+'</small></div></div></div><div class="sec">'+
'<div class="card"><div class="mt">Rekening terdaftar</div><b>'+esc(u.bank||"-")+' · '+esc(u.rek||"belum diisi")+'</b></div><button class="btn o" onclick="if(confirm(\'Hapus semua data demo?\')){DB=seed();save();render()}">Reset data demo</button><button class="btn r" onclick="logout()">Keluar</button><div class="mt" style="text-align:center;margin-top:14px">ECO-TING v0.1 · Kelompok 7 Kelas D</div></div>'}
render();
</script>
